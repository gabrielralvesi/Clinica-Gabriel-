<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicFlow Pro - Sistema Completo de Gestão Clínica</title>
    
    <!-- Fontes e ícones -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-light: #d1fae5;
            --bg: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text: #ffffff;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
            --radius: 0.75rem;
            --radius-full: 9999px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .hidden { display: none !important; }

        /* Header */
        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: var(--primary);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .logo-text h1 {
            font-size: 1.5rem;
            margin: 0;
        }

        .logo-text p {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin: 0;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .date-display {
            padding: 0.5rem 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-full);
            font-size: 0.875rem;
        }

        .btn-icon {
            padding: 0.5rem 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-full);
            color: var(--text-muted);
            cursor: pointer;
        }

        .btn-icon:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Navegação */
        .nav-tabs {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
        }

        .nav-container {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
        }

        .nav-tab {
            padding: 1rem 1.5rem;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 500;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-tab:hover {
            color: var(--primary);
        }

        .nav-tab.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }

        /* Main */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-title i {
            color: var(--primary);
        }

        .card-mini {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
        }

        /* Grids */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        @media (max-width: 768px) {
            .grid-2, .grid-3 {
                grid-template-columns: 1fr;
            }
        }

        /* Stat Cards */
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            background: var(--primary-light);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 600;
            line-height: 1.2;
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        /* Formulários */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: inherit;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }

        select.form-control {
            cursor: pointer;
        }

        textarea.form-control {
            min-height: 100px;
            resize: vertical;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
        }

        .input-group .form-control {
            flex: 1;
        }

        /* Botões */
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: var(--bg-hover);
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-danger {
            background: var(--error);
            border-color: var(--error);
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }

        /* Listas */
        .list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .list-item {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
            transition: all 0.2s;
        }

        .list-item:hover {
            border-color: var(--primary);
        }

        /* Pills */
        .pill {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 500;
            background: var(--bg);
            border: 1px solid var(--border);
        }

        .pill-success {
            background: var(--primary-light);
            color: var(--primary);
            border-color: transparent;
        }

        .pill-warning {
            background: #fef3c7;
            color: var(--warning);
            border-color: transparent;
        }

        /* Progresso */
        .progress-bar {
            height: 8px;
            background: var(--bg);
            border-radius: var(--radius-full);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: var(--radius-full);
            transition: width 0.3s;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 2rem;
        }

        /* Tabs Anamnese */
        .anamnese-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .anamnese-tab {
            padding: 0.5rem 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
        }

        .anamnese-tab:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .anamnese-tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .anamnese-section {
            margin-bottom: 2rem;
        }

        .anamnese-section h4 {
            color: var(--primary);
            margin-bottom: 1rem;
        }

        /* Agenda */
        .schedule-table {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 0.75rem;
            text-align: left;
        }

        th {
            background: var(--bg);
        }

        .slot {
            padding: 0.5rem;
            border-radius: var(--radius);
            cursor: pointer;
        }

        .slot-cassems {
            background: var(--primary-light);
        }

        .slot-particular {
            background: #fef3c7;
        }

        .slot-empty {
            background: var(--bg);
            opacity: 0.5;
        }

        /* Token */
        .token-counter {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: var(--bg);
            border-radius: var(--radius);
            margin: 1rem 0;
        }

        .token-progress {
            flex: 1;
            height: 8px;
            background: var(--border);
            border-radius: var(--radius-full);
        }

        .token-progress-fill {
            height: 100%;
            background: var(--warning);
            border-radius: var(--radius-full);
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // ============================================
        // DADOS INICIAIS (localStorage)
        // ============================================
        let pacientes = JSON.parse(localStorage.getItem('pacientes')) || [];
        let sessoes = JSON.parse(localStorage.getItem('sessoes')) || [];
        let tokens = JSON.parse(localStorage.getItem('tokens')) || {};
        let agenda = JSON.parse(localStorage.getItem('agenda')) || { 
            horarios: DEFAULT_TIMES, 
            recorrencias: {} 
        };
        
        let pacienteAtual = null;
        let pacienteSelecionado = null;

        // ============================================
        // CONSTANTES
        // ============================================
        const DEFAULT_TIMES = [
            "07:00", "07:40", "08:20", "09:00", "09:40", "10:20", "11:00",
            "13:00", "13:40", "14:20", "15:00", "15:40", "16:20", "17:00", "17:40"
        ];

        const DIAS = ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"];

        // ============================================
        // FUNÇÕES AUXILIARES
        // ============================================
        function $(id) {
            return document.getElementById(id);
        }

        function salvarDados() {
            localStorage.setItem('pacientes', JSON.stringify(pacientes));
            localStorage.setItem('sessoes', JSON.stringify(sessoes));
            localStorage.setItem('tokens', JSON.stringify(tokens));
            localStorage.setItem('agenda', JSON.stringify(agenda));
        }

        function mostrarAlerta(mensagem, tipo = 'success') {
            alert(mensagem);
        }

        function formatarData(data) {
            if (!data) return '';
            return new Date(data).toLocaleDateString('pt-BR');
        }

        function formatarMoeda(valor) {
            return Number(valor || 0).toLocaleString('pt-BR', { 
                style: 'currency', 
                currency: 'BRL' 
            });
        }

        function calcularStatsPaciente(pacienteId) {
            const sessoesPaciente = sessoes.filter(s => s.pacienteId === pacienteId);
            return {
                total: sessoesPaciente.length,
                realizadas: sessoesPaciente.filter(s => s.status === 'realizou').length,
                faltas: sessoesPaciente.filter(s => s.status === 'nao').length,
                debito: sessoesPaciente
                    .filter(s => s.status === 'realizou' && !s.pago)
                    .reduce((sum, s) => sum + (Number(s.valor) || 0), 0)
            };
        }

        // ============================================
        // RENDERIZAR APP
        // ============================================
        function renderizarApp() {
            const app = document.getElementById('app');
            
            app.innerHTML = `
                <div>
                    <!-- HEADER -->
                    <header class="header">
                        <div class="logo">
                            <div class="logo-icon">CF</div>
                            <div class="logo-text">
                                <h1>ClinicFlow Pro</h1>
                                <p>Sistema Completo de Gestão Clínica</p>
                            </div>
                        </div>
                        
                        <div class="header-actions">
                            <div class="date-display" id="dataAtual"></div>
                            <button class="btn-icon" onclick="exportarDados()">
                                <i class="fas fa-download"></i>
                            </button>
                            <button class="btn-icon" onclick="importarDados()">
                                <i class="fas fa-upload"></i>
                            </button>
                        </div>
                    </header>

                    <!-- NAVEGAÇÃO -->
                    <nav class="nav-tabs">
                        <div class="nav-container">
                            <button class="nav-tab active" onclick="mudarAba('dashboard')" id="tabDashboard">
                                <i class="fas fa-chart-line"></i> Dashboard
                            </button>
                            <button class="nav-tab" onclick="mudarAba('diario')" id="tabDiario">
                                <i class="fas fa-calendar-day"></i> Diário
                            </button>
                            <button class="nav-tab" onclick="mudarAba('pacientes')" id="tabPacientes">
                                <i class="fas fa-users"></i> Pacientes
                            </button>
                            <button class="nav-tab" onclick="mudarAba('agenda')" id="tabAgenda">
                                <i class="fas fa-calendar-alt"></i> Agenda
                            </button>
                            <button class="nav-tab" onclick="mudarAba('relatorios')" id="tabRelatorios">
                                <i class="fas fa-chart-bar"></i> Relatórios
                            </button>
                        </div>
                    </nav>

                    <!-- CONTEÚDO PRINCIPAL -->
                    <main class="main-content">
                        <!-- DASHBOARD -->
                        <div id="viewDashboard">
                            ${renderizarDashboard()}
                        </div>

                        <!-- DIÁRIO -->
                        <div id="viewDiario" class="hidden">
                            ${renderizarDiario()}
                        </div>

                        <!-- PACIENTES -->
                        <div id="viewPacientes" class="hidden">
                            ${renderizarPacientes()}
                        </div>

                        <!-- AGENDA -->
                        <div id="viewAgenda" class="hidden">
                            ${renderizarAgenda()}
                        </div>

                        <!-- RELATÓRIOS -->
                        <div id="viewRelatorios" class="hidden">
                            ${renderizarRelatorios()}
                        </div>
                    </main>
                </div>
            `;

            document.getElementById('dataAtual').innerHTML = new Date().toLocaleDateString('pt-BR', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }

        // ============================================
        // DASHBOARD
        // ============================================
        function renderizarDashboard() {
            const hoje = new Date().toISOString().split('T')[0];
            const sessoesHoje = sessoes.filter(s => s.data === hoje);
            
            const realizadas = sessoesHoje.filter(s => s.status === 'realizou').length;
            const faltas = sessoesHoje.filter(s => s.status === 'nao').length;
            
            const faturamento = sessoesHoje
                .filter(s => s.status === 'realizou' && s.pago === true)
                .reduce((sum, s) => sum + (Number(s.valor) || 0), 0);

            return `
                <div class="dashboard-grid">
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-users"></i></div>
                        <div class="stat-value">${sessoesHoje.length}</div>
                        <div class="stat-label">Pacientes Hoje</div>
                        <div class="stat-label">${realizadas} realizadas • ${faltas} faltas</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-dollar-sign"></i></div>
                        <div class="stat-value">${formatarMoeda(faturamento)}</div>
                        <div class="stat-label">Faturamento Hoje</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-users"></i></div>
                        <div class="stat-value">${pacientes.length}</div>
                        <div class="stat-label">Total de Pacientes</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-ticket-alt"></i></div>
                        <div class="stat-value">${Object.keys(tokens).length}</div>
                        <div class="stat-label">Tokens Registrados</div>
                    </div>
                </div>

                <div class="card">
                    <h3 class="card-title">
                        <i class="fas fa-birthday-cake"></i>
                        Aniversariantes do Mês
                    </h3>
                    <div class="list">
                        ${renderizarAniversariantes()}
                    </div>
                </div>
            `;
        }

        function renderizarAniversariantes() {
            const mes = new Date().getMonth() + 1;
            const aniversariantes = pacientes.filter(p => {
                if (!p.nascimento) return false;
                return parseInt(p.nascimento.split('-')[1]) === mes;
            });

            if (aniversariantes.length === 0) {
                return '<div class="list-item">Nenhum aniversariante este mês</div>';
            }

            return aniversariantes.map(p => `
                <div class="list-item">
                    <strong>${p.nome}</strong>
                    <div style="font-size: 0.875rem; color: var(--text-muted);">
                        ${formatarData(p.nascimento)}
                    </div>
                </div>
            `).join('');
        }

        // ============================================
        // DIÁRIO
        // ============================================
        function renderizarDiario() {
            const hoje = new Date().toISOString().split('T')[0];
            
            return `
                <div class="card">
                    <div class="grid-2">
                        <div class="form-group">
                            <label class="form-label">Data</label>
                            <input type="date" id="dataDiario" class="form-control" value="${hoje}" onchange="renderizarSessoes()">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Buscar paciente</label>
                            <input type="text" id="buscaDiario" class="form-control" placeholder="Nome..." oninput="renderizarSessoes()">
                        </div>
                    </div>

                    <div class="grid-3" style="margin: 1rem 0;">
                        <div class="card-mini">
                            <div class="stat-label">Total</div>
                            <div class="stat-value" style="font-size: 1.5rem;" id="totalDia">0</div>
                        </div>
                        <div class="card-mini">
                            <div class="stat-label">Faturamento</div>
                            <div class="stat-value" style="font-size: 1.5rem;" id="faturamentoDia">R$ 0</div>
                        </div>
                        <div class="card-mini">
                            <div class="stat-label">Faltas</div>
                            <div class="stat-value" style="font-size: 1.5rem;" id="faltasDia">0</div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Adicionar sessão</label>
                        <div class="grid-2">
                            <select id="pacienteSessao" class="form-control">
                                <option value="">Selecione um paciente</option>
                                ${pacientes.map(p => `<option value="${p.id}">${p.nome}</option>`).join('')}
                            </select>
                            <input type="time" id="horaSessao" class="form-control" value="08:00">
                            <select id="statusSessao" class="form-control">
                                <option value="realizou">✅ Realizou</option>
                                <option value="nao">❌ Não realizou</option>
                            </select>
                            <select id="pagamentoSessao" class="form-control">
                                <option value="false">💸 Não pago</option>
                                <option value="true">💰 Pago</option>
                            </select>
                            <input type="number" id="valorSessao" class="form-control" placeholder="Valor" step="0.01">
                        </div>
                        <button class="btn btn-primary" onclick="adicionarSessao()" style="margin-top: 1rem;">
                            <i class="fas fa-plus"></i> Adicionar
                        </button>
                    </div>

                    <div id="listaSessoes" class="list"></div>
                </div>
            `;
        }

        function renderizarSessoes() {
            const data = document.getElementById('dataDiario')?.value || new Date().toISOString().split('T')[0];
            const busca = document.getElementById('buscaDiario')?.value?.toLowerCase() || '';
            
            const sessoesDia = sessoes.filter(s => s.data === data);
            
            const pacientesObj = {};
            pacientes.forEach(p => pacientesObj[p.id] = p);
            
            const sessoesFiltradas = sessoesDia.filter(s => {
                const paciente = pacientesObj[s.pacienteId];
                return paciente?.nome.toLowerCase().includes(busca);
            });

            document.getElementById('totalDia').innerHTML = sessoesFiltradas.length;
            
            const totalFaturamento = sessoesFiltradas
                .filter(s => s.status === 'realizou' && s.pago === true)
                .reduce((sum, s) => sum + (Number(s.valor) || 0), 0);
            document.getElementById('faturamentoDia').innerHTML = formatarMoeda(totalFaturamento);
            document.getElementById('faltasDia').innerHTML = sessoesFiltradas.filter(s => s.status === 'nao').length;

            const lista = document.getElementById('listaSessoes');
            
            if (sessoesFiltradas.length === 0) {

                                        ${s.status === 'realizou' ? '✅ Realizou' : '❌ Não realizou'}
                                    </span>
                                    <span class="pill ${s.pago ? 'pill-success' : 'pill-warning'}">

                                    </span>
                                </div>
                            </div>

        function adicionarSessao() {
            const pacienteId = document.getElementById('pacienteSessao')?.value;
            const data = document.getElementById('dataDiario')?.value;
            const hora = document.getElementById('horaSessao')?.value;
            const status = document.getElementById('statusSessao')?.value;
            const pago = document.getElementById('pagamentoSessao')?.value === 'true';
            const valor = parseFloat(document.getElementById('valorSessao')?.value || 0);

            if (!pacienteId || !data) {
                alert('Selecione um paciente e uma data');
                return;
            }

            const sessao = {
                id: Date.now().toString(),
                pacienteId,
                data,
                hora,
                status,
                pago,
                valor
            };

            sessoes.push(sessao);
            
            const paciente = pacientes.find(p => p.id === pacienteId);
            if (paciente?.convenio === 'cassems') {
                tokens[sessao.id] = {
                    status: 'pendente',
                    data: data,
                    pacienteId: pacienteId
                };
            }
            
            salvarDados();
            document.getElementById('horaSessao').value = '08:00';
            document.getElementById('valorSessao').value = '';
            renderizarSessoes();
            mostrarAlerta('Sessão adicionada!');
        }

        function alternarStatus(id) {
            const sessao = sessoes.find(s => s.id === id);
            if (sessao) {
                sessao.status = sessao.status === 'realizou' ? 'nao' : 'realizou';
                salvarDados();
                renderizarSessoes();
            }
        }

        function alternarPagamento(id) {
            const sessao = sessoes.find(s => s.id === id);
            if (sessao) {
                sessao.pago = !sessao.pago;
                salvarDados();
                renderizarSessoes();
            }
        }

        function excluirSessao(id) {
            if (confirm('Excluir esta sessão?')) {
                sessoes = sessoes.filter(s => s.id !== id);
                delete tokens[id];
                salvarDados();
                renderizarSessoes();
            }
        }

        function adicionarPaciente() {
            const nome = document.getElementById('nomePaciente')?.value;
            if (!nome) {
                alert('Nome é obrigatório');
                return;
            }

            const paciente = {
                id: Date.now().toString(),
                nome: nome,
                nascimento: document.getElementById('nascimentoPaciente')?.value || '',
                telefone: document.getElementById('telefonePaciente')?.value || '',
                convenio: document.getElementById('convenioPaciente')?.value || 'particular',
                valorPadrao: parseFloat(document.getElementById('valorPaciente')?.value || 0),
                anamnese: {}
            };

            pacientes.push(paciente);
            salvarDados();
            
            document.getElementById('nomePaciente').value = '';
            document.getElementById('nascimentoPaciente').value = '';
            document.getElementById('telefonePaciente').value = '';
            document.getElementById('valorPaciente').value = '';
            
            renderizarListaPacientes();
            mostrarAlerta('Paciente cadastrado com sucesso!');
        }

        function renderizarListaPacientes() {
            const busca = document.getElementById('buscaPaciente')?.value?.toLowerCase() || '';
            const lista = document.getElementById('listaPacientes');
            
            if (!lista) return;

            const pacientesFiltrados = pacientes.filter(p => 
                p.nome.toLowerCase().includes(busca)
            );

            if (pacientesFiltrados.length === 0) {
                lista.innerHTML = '<div class="list-item">Nenhum paciente encontrado</div>';
                return;
            }

            lista.innerHTML = pacientesFiltrados.map(p => {
                const stats = calcularStatsPaciente(p.id);
                return `
                    <div class="list-item" onclick="abrirPasta('${p.id}')" style="cursor: pointer;">
                        <div style="display: flex; justify-content: space-between;">
                            <div>
                                <strong>${p.nome}</strong>
                                <div style="font-size: 0.875rem; color: var(--text-muted);">
                                    ${p.convenio} • ${stats.total} sessões
                                </div>
                                <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
                                    <span class="pill pill-success">✅ ${stats.realizadas}</span>
                                    <span class="pill pill-warning">❌ ${stats.faltas}</span>
                                </div>
                            </div>
                            <div>
                                ${stats.debito > 0 ? `<span class="pill pill-warning">${formatarMoeda(stats.debito)}</span>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function abrirPasta(id) {
            const paciente = pacientes.find(p => p.id === id);
            if (!paciente) return;

            pacienteSelecionado = paciente;
            
            document.getElementById('pastaPaciente').classList.remove('hidden');
            document.getElementById('tituloPasta').innerHTML = paciente.nome;
            
            const stats = calcularStatsPaciente(id);
            const percentual = stats.total > 0 ? (stats.realizadas / stats.total) * 100 : 0;
            
            document.getElementById('progressoPaciente').style.width = `${percentual}%`;
            document.getElementById('statsPaciente').innerHTML = `
                <div class="card-mini">
                    <div class="stat-label">Realizadas</div>
                    <div class="stat-value" style="font-size: 1.5rem;">${stats.realizadas}</div>
                </div>
                <div class="card-mini">
                    <div class="stat-label">Faltas</div>
                    <div class="stat-value" style="font-size: 1.5rem;">${stats.faltas}</div>
                </div>
                <div class="card-mini">
                    <div class="stat-label">Débito</div>
                    <div class="stat-value" style="font-size: 1.5rem;">${formatarMoeda(stats.debito)}</div>
                </div>
            `;

            const historico = sessoes
                .filter(s => s.pacienteId === id)
                .sort((a, b) => b.data.localeCompare(a.data));

            document.getElementById('historicoPaciente').innerHTML = historico.length ? historico.map(s => `
                <div class="list-item">
                    <div style="display: flex; justify-content: space-between;">
                        <div>
                            <strong>${formatarData(s.data)} ${s.hora || ''}</strong>

                        </div>
                    </div>
                </div>
            `).join('') : '<div class="list-item">Nenhuma sessão registrada</div>';
        }

        function mudarTabAnamnese(tab, elemento) {
            document.querySelectorAll('.anamnese-section').forEach(el => {
                el.classList.add('hidden');
            });
            
            if (tab === 'identificacao') document.getElementById('tabIdentificacao')?.classList.remove('hidden');
            if (tab === 'queixa') document.getElementById('tabQueixa')?.classList.remove('hidden');
            if (tab === 'gestacional') document.getElementById('tabGestacional')?.classList.remove('hidden');
            if (tab === 'desenvolvimento') document.getElementById('tabDesenvolvimento')?.classList.remove('hidden');
            if (tab === 'alimentacao') document.getElementById('tabAlimentacao')?.classList.remove('hidden');
            if (tab === 'saude') document.getElementById('tabSaude')?.classList.remove('hidden');
            if (tab === 'escolar') document.getElementById('tabEscolar')?.classList.remove('hidden');
            if (tab === 'familiar') document.getElementById('tabFamiliar')?.classList.remove('hidden');
            if (tab === 'obs') document.getElementById('tabObs')?.classList.remove('hidden');
            
            document.querySelectorAll('.anamnese-tab').forEach(el => {
                el.classList.remove('active');
            });
            elemento.classList.add('active');
        }

        function salvarAnamnese() {
            if (!pacienteSelecionado) return;
            
            pacienteSelecionado.anamnese = {
                // Identificação
                sexo: document.getElementById('anamneseSexo')?.value || '',
                naturalidade: document.getElementById('anamneseNaturalidade')?.value || '',
                endereco: document.getElementById('anamneseEndereco')?.value || '',
                email: document.getElementById('anamneseEmail')?.value || '',
                responsavel: document.getElementById('anamneseResponsavel')?.value || '',
                parentesco: document.getElementById('anamneseParentesco')?.value || '',
                telefoneResponsavel: document.getElementById('anamneseTelResponsavel')?.value || '',
                
                // Queixa
                queixaPrincipal: document.getElementById('anamneseQueixa')?.value || '',
                inicioQueixa: document.getElementById('anamneseInicioQueixa')?.value || '',
                quemObservou: document.getElementById('anamneseQuemObservou')?.value || '',
                evolucaoQueixa: document.getElementById('anamneseEvolucao')?.value || '',
                tratamentosAnteriores: document.getElementById('anamneseTratamentos')?.value || '',
                
                // Gestacional
                gestacaoDesejada: document.getElementById('anamneseGestacaoDesejada')?.value || '',
                intercorrenciasGestacao: document.getElementById('anamneseIntercorrencias')?.value || '',
                medicamentosGestacao: document.getElementById('anamneseMedicamentosGestacao')?.value || '',
                tipoParto: document.getElementById('anamneseTipoParto')?.value || '',
                localParto: document.getElementById('anamneseLocalParto')?.value || '',
                tempoGestacao: document.getElementById('anamneseTempoGestacao')?.value || '',

                apgar: document.getElementById('anamneseApgar')?.value || '',

                // Desenvolvimento

                composicaoFamiliar: document.getElementById('anamneseComposicao')?.value || '',

            pacienteSelecionado.telefone = document.getElementById('anamneseTelefone')?.value || pacienteSelecionado.telefone;

        }

        // ============================================
        // AGENDA
        // ============================================
        function renderizarAgenda() {
            let tabela = '<table><thead><tr><th>Horário</th>';
            DIAS.forEach(dia => tabela += `<th>${dia}</th>`);
            tabela += '</tr></thead><tbody>';
            
            const horarios = agenda.horarios || DEFAULT_TIMES;
            
            horarios.forEach(hora => {
                tabela += `<tr><td><strong>${hora}</strong></td>`;
                for (let dia = 0; dia < 7; dia++) {
                    const key = `${dia}|${hora}`;
                    const agendamento = agenda.recorrencias?.[key];
                    
                    if (agendamento) {
                        const paciente = pacientes.find(p => p.id === agendamento.pacienteId);
                        const classe = agendamento.convenio === 'cassems' ? 'slot-cassems' : 
                                      agendamento.convenio === 'particular' ? 'slot-particular' : 'slot';
                        tabela += `
                            <td onclick="agendarHorario(${dia}, '${hora}')">
                                <div class="slot ${classe}">
                                    <strong>${paciente?.nome || '?'}</strong>
                                </div>
                            </td>
                        `;
                    } else {
                        tabela += `
                            <td onclick="agendarHorario(${dia}, '${hora}')">
                                <div class="slot slot-empty">
                                    <span style="opacity: 0.5;">Vago</span>
                                </div>
                            </td>
                        `;
                    }
                }
                tabela += '</tr>';
            });
            
            tabela += '</tbody></table>';
            
            return `
                <div class="card">
                    <div class="grid-2" style="margin-bottom: 1rem;">
                        <div class="form-group">
                            <label class="form-label">Adicionar horário</label>
                            <div class="input-group">
                                <input type="time" id="novoHorario" class="form-control" value="08:00">
                                <button class="btn btn-primary" onclick="adicionarHorario()">
                                    <i class="fas fa-plus"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="schedule-table">
                        ${tabela}
                    </div>
                    
                    <div style="display: flex; gap: 1rem; margin-top: 1rem; flex-wrap: wrap;">
                        <span class="pill pill-success">Cassems</span>
                        <span class="pill pill-warning">Particular</span>
                        <span class="pill">Unimed/Outros</span>
                        <span class="pill">Vago</span>
                    </div>
                </div>
            `;
        }

        function adicionarHorario() {
            const horario = document.getElementById('novoHorario')?.value;
            if (!horario) return;
            
            if (!agenda.horarios) agenda.horarios = DEFAULT_TIMES;
            if (!agenda.horarios.includes(horario)) {
                agenda.horarios.push(horario);
                agenda.horarios.sort();
                salvarDados();
                mudarAba('agenda');
            }
        }

        function agendarHorario(dia, hora) {
            const key = `${dia}|${hora}`;
            const atual = agenda.recorrencias?.[key];
            
            if (atual) {
                if (confirm('Remover este agendamento?')) {
                    delete agenda.recorrencias[key];
                    salvarDados();
                    mudarAba('agenda');
                }
                return;
            }
            
            if (pacientes.length === 0) {
                alert('Cadastre um paciente primeiro');
                return;
            }
            
            const listaPacientes = pacientes.map((p, i) => `${i+1} - ${p.nome}`).join('\n');
            const escolha = prompt(
                `Agendar em ${DIAS[dia]} às ${hora}\n\n` +
                `Digite o número do paciente:\n${listaPacientes}\n\n` +
                `Ou 0 para cancelar`
            );
            
            if (escolha && escolha !== '0') {
                const idx = parseInt(escolha) - 1;
                if (idx >= 0 && idx < pacientes.length) {
                    if (!agenda.recorrencias) agenda.recorrencias = {};
                    agenda.recorrencias[key] = {
                        pacienteId: pacientes[idx].id,
                        convenio: pacientes[idx].convenio
                    };
                    salvarDados();
                    mudarAba('agenda');
                }
            }
        }

        // ============================================
        // RELATÓRIOS
        // ============================================
        function renderizarRelatorios() {
            const mes = new Date().toISOString().slice(0, 7);
            const sessoesMes = sessoes.filter(s => s.data && s.data.startsWith(mes));
            
            const realizadas = sessoesMes.filter(s => s.status === 'realizou');
            const faturamento = realizadas.filter(s => s.pago).reduce((sum, s) => sum + (Number(s.valor) || 0), 0);
            const aReceber = realizadas.filter(s => !s.pago).reduce((sum, s) => sum + (Number(s.valor) || 0), 0);
            
            const tokensEnviados = Object.values(tokens).filter(t => t.status === 'enviado').length;
            const tokensPendentes = Object.values(tokens).filter(t => t.status === 'pendente').length;
            const tokensProblema = Object.values(tokens).filter(t => t.status === 'problema').length;

            return `
                <div class="grid-2">
                    <div class="card-mini">
                        <div class="stat-label">Sessões no mês</div>
                        <div class="stat-value" style="font-size: 2rem;">${sessoesMes.length}</div>
                        <div>${realizadas.length} realizadas • ${sessoesMes.length - realizadas.length} faltas</div>
                    </div>
                    
                    <div class="card-mini">
                        <div class="stat-label">Faturamento</div>
                        <div class="stat-value" style="font-size: 2rem;">${formatarMoeda(faturamento)}</div>
                        <div>A receber: ${formatarMoeda(aReceber)}</div>
                    </div>
                    
                    <div class="card-mini">
                        <div class="stat-label">Pacientes</div>
                        <div class="stat-value" style="font-size: 2rem;">${pacientes.length}</div>
                        <div>Cadastrados</div>
                    </div>
                </div>
                
                <div class="card">
                    <h3 class="card-title">
                        <i class="fas fa-ticket-alt"></i>
                        Controle de Tokens Cassems
                    </h3>
                    <div class="grid-3">
                        <div class="card-mini">
                            <div class="stat-label">Enviados</div>
                            <div class="stat-value" style="font-size: 1.5rem; color: var(--success);">${tokensEnviados}</div>
                        </div>
                        <div class="card-mini">
                            <div class="stat-label">Pendentes</div>
                            <div class="stat-value" style="font-size: 1.5rem; color: var(--warning);">${tokensPendentes}</div>
                        </div>
                        <div class="card-mini">
                            <div class="stat-label">Problema</div>
                            <div class="stat-value" style="font-size: 1.5rem; color: var(--error);">${tokensProblema}</div>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <h3 class="card-title">
                        <i class="fas fa-exclamation-triangle"></i>
                        Pacientes com débito
                    </h3>
                    <div class="list">
                        ${renderizarDevedores()}
                    </div>
                </div>
            `;
        }

        function renderizarDevedores() {
            const devedores = [];
            
            pacientes.forEach(p => {
                const debito = sessoes
                    .filter(s => s.pacienteId === p.id && s.status === 'realizou' && !s.pago)
                    .reduce((sum, s) => sum + (Number(s.valor) || 0), 0);
                    
                if (debito > 0) {
                    devedores.push({ nome: p.nome, debito });
                }
            });
            
            devedores.sort((a, b) => b.debito - a.debito);
            
            if (devedores.length === 0) {
                return '<div class="list-item">Nenhum paciente com débito</div>';
            }
            
            return devedores.map(d => `
                <div class="list-item">
                    <div style="display: flex; justify-content: space-between;">
                        <strong>${d.nome}</strong>
                        <span class="pill pill-warning">${formatarMoeda(d.debito)}</span>
                    </div>
                </div>
            `).join('');
        }

        // ============================================
        // NAVEGAÇÃO
        // ============================================
        function mudarAba(aba) {
            document.getElementById('viewDashboard')?.classList.add('hidden');
            document.getElementById('viewDiario')?.classList.add('hidden');
            document.getElementById('viewPacientes')?.classList.add('hidden');
            document.getElementById('viewAgenda')?.classList.add('hidden');
            document.getElementById('viewRelatorios')?.classList.add('hidden');
            
            if (aba === 'dashboard') document.getElementById('viewDashboard')?.classList.remove('hidden');
            if (aba === 'diario') document.getElementById('viewDiario')?.classList.remove('hidden');
            if (aba === 'pacientes') document.getElementById('viewPacientes')?.classList.remove('hidden');
            if (aba === 'agenda') document.getElementById('viewAgenda')?.classList.remove('hidden');
            if (aba === 'relatorios') document.getElementById('viewRelatorios')?.classList.remove('hidden');
            
            document.querySelectorAll('.nav-tab').forEach(el => {
                el.classList.remove('active');
            });
            
            if (aba === 'dashboard') document.getElementById('tabDashboard')?.classList.add('active');
            if (aba === 'diario') document.getElementById('tabDiario')?.classList.add('active');
            if (aba === 'pacientes') document.getElementById('tabPacientes')?.classList.add('active');
            if (aba === 'agenda') document.getElementById('tabAgenda')?.classList.add('active');
            if (aba === 'relatorios') document.getElementById('tabRelatorios')?.classList.add('active');
            
            if (aba === 'diario') {
                renderizarSessoes();
            }
            
            if (aba === 'pacientes') {
                renderizarListaPacientes();
                document.getElementById('pastaPaciente')?.classList.add('hidden');
            }
            
            if (aba === 'agenda') {
                document.getElementById('viewAgenda').innerHTML = renderizarAgenda();
            }
            
            if (aba === 'relatorios') {
                document.getElementById('viewRelatorios').innerHTML = renderizarRelatorios();
            }
        }

        // ============================================
        // EXPORTAR/IMPORTAR
        // ============================================
        function exportarDados() {
            const dados = {
                pacientes,
                sessoes,
                tokens,
                agenda,
                data: new Date().toISOString(),
                versao: '1.0'
            };
            
            const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup_clinicflow_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importarDados() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                
                reader.onload = (e) => {
                    try {
                        const dados = JSON.parse(e.target.result);
                        if (dados.pacientes) pacientes = dados.pacientes;
                        if (dados.sessoes) sessoes = dados.sessoes;
                        if (dados.tokens) tokens = dados.tokens;
                        if (dados.agenda) agenda = dados.agenda;
                        
                        salvarDados();
                        location.reload();
                    } catch (erro) {
                        alert('Arquivo inválido');
                    }
                };
                
                reader.readAsText(file);
            };
            
            input.click();
        }

        // ============================================
        // UTILITÁRIOS
        // ============================================
        function fecharModal() {
            const modal = document.getElementById('modalAnamnese');
            if (modal) modal.remove();
        }

        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        renderizarApp();
        renderizarListaPacientes();
    </script>
</body>
